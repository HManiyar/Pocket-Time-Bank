<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c6b55">
<title>Pocket Time Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single-column passbook. Day view with deposits and withdrawals, a progress statement, and settings, switched by a bottom tab bar. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunken:#e8ece7; --line:#d5dcd4;
  --fg:#17211d; --muted:#5d6b64;
  --accent:#1c6b55; --accent-ink:#ffffff; --accent-soft:#d6ebe2;
  --invest:#1c6b55; --maint:#6b7a8f; --waste:#b4452f; --waste-soft:#f5dcd5;
  --gold:#a07a1c;
  --font-display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --sunken:#1f2824; --line:#2c3833;
  --fg:#e5ece8; --muted:#94a39c;
  --accent:#4fbf98; --accent-ink:#06140f; --accent-soft:#1b3a2f;
  --invest:#4fbf98; --maint:#8c9bb0; --waste:#e8795f; --waste-soft:#3d2019;
  --gold:#d9b155; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --sunken:#1f2824; --line:#2c3833;
  --fg:#e5ece8; --muted:#94a39c;
  --accent:#4fbf98; --accent-ink:#06140f; --accent-soft:#1b3a2f;
  --invest:#4fbf98; --maint:#8c9bb0; --waste:#e8795f; --waste-soft:#3d2019;
  --gold:#d9b155; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--invest)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}

/* Passbook header */
.passbook{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.passbook .eyebrow{color:inherit;opacity:.78}
.passbook .big{font-family:var(--font-mono);font-size:30px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.passbook .sub{font-size:12.5px;opacity:.85}
.passbook .full{grid-column:1/-1;display:flex;gap:6px;height:8px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.passbook .full span{display:block;height:100%}

.datenav{display:flex;align-items:center;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.datelabel{font-weight:600;min-width:0;flex:1;text-align:center}

/* Habits */
.habit{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;text-align:left}
.habit .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.habit.done{background:var(--accent-soft);border-color:transparent}
.habit.done .box{background:var(--invest);border-color:var(--invest)}
.habit .name{flex:1;min-width:0;font-weight:500}
.habit .meta{font-size:12.5px;color:var(--muted);text-align:right}
.streak{color:var(--gold);font-weight:600}
.habits{display:flex;flex-direction:column;gap:8px}

/* Timer */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.running{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--sunken)}
.running .clock{font-family:var(--font-mono);font-size:26px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--waste);border-color:color-mix(in srgb,var(--waste) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:default}

/* Forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;font-size:15px;color:var(--fg);min-width:0}
textarea{font-family:var(--font-mono);font-size:12px;min-height:90px;resize:vertical}

/* Ledger list */
.ledger{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.entry:first-child{border-top:0}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.tag.invest{background:var(--accent-soft);color:var(--invest)}
.tag.maint{background:var(--sunken);color:var(--maint)}
.tag.waste{background:var(--waste-soft);color:var(--waste)}
.entry .what{min-width:0}
.entry .what b{font-weight:500;display:block;overflow-wrap:anywhere}
.entry .what span{font-size:12.5px;color:var(--muted)}
.amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.amt.plus{color:var(--invest)} .amt.minus{color:var(--waste)} .amt.zero{color:var(--maint)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:8px}

.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px}
.banner{background:var(--sunken);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:block;width:14px;height:3px;border-radius:2px}
.heat{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:3px;background:var(--sunken);max-width:100%}
.statement{width:100%;border-collapse:collapse;font-size:14px}
.statement td{padding:7px 0;border-top:1px dashed var(--line)}
.statement tr:first-child td{border-top:0}
.statement td:last-child{text-align:right}
.statement tfoot td{border-top:1px solid var(--fg);font-weight:600}

/* Settings lists */
.setrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.setrow:first-child{border-top:0}
.confirm{background:var(--waste-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:540px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){ .habit,.chip,.btn{transition:background .15s,border-color .15s} }
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button class="tab" role="tab" data-tab="day" id="tab-day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Today</button>
  <button class="tab" role="tab" data-tab="progress" id="tab-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M5 16l4.5-5 3.5 3 6-7"/></svg>Progress</button>
  <button class="tab" role="tab" data-tab="settings" id="tab-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<input type="file" id="restoreFile" accept=".json,application/json,text/plain" hidden>

<script>
(function(){
"use strict";
const LS_KEY = "pocket-time-bank.v1";
const KINDS = {invest:"Invested", maint:"Maintenance", waste:"Wasted"};

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const monthOf = k => k.slice(0,7);
function fmtHM(min){ min = Math.round(Math.abs(min)); const h = Math.floor(min/60), m = min%60; return h ? (m ? h+"h "+pad(m)+"m" : h+"h") : m+"m"; }
function fmtClock(ms){ const s = Math.floor(ms/1000); return Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60); }
function fmtDay(k){
  const t = todayKey();
  if (k === t) return "Today";
  if (k === addDays(t,-1)) return "Yesterday";
  return parseKey(k).toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
}
function fmtTime(ms){ return new Date(ms).toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"}); }

/* ---------- state ---------- */
function defaultState(){
  const now = Date.now(), t = todayKey();
  const cats = [
    {id:"deep", name:"Deep work", kind:"invest"},
    {id:"learn", name:"Learning", kind:"invest"},
    {id:"fit", name:"Exercise", kind:"invest"},
    {id:"read", name:"Reading", kind:"invest"},
    {id:"sleep", name:"Sleep", kind:"maint"},
    {id:"chores", name:"Meals & chores", kind:"maint"},
    {id:"rest", name:"Intentional rest", kind:"maint"},
    {id:"social", name:"Social media", kind:"waste"},
    {id:"video", name:"Aimless videos", kind:"waste"},
    {id:"procr", name:"Procrastination", kind:"waste"}
  ];
  const habits = [
    {id:"h-read", name:"Read 20 pages", min:30, cat:"read", from:t},
    {id:"h-gym", name:"Workout", min:45, cat:"fit", from:t},
    {id:"h-learn", name:"Study a skill", min:60, cat:"learn", from:t}
  ];
  return {config:{u:now, start:t, cats, habits, wasteLimit:3, running:null, sample:false}, months:{}};
}
let S = loadLocal() || defaultState();
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (!raw) return null; const s = JSON.parse(raw); return valid(s) ? s : null; } catch(e){ return null; }
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function valid(s){ return s && s.config && Array.isArray(s.config.cats) && Array.isArray(s.config.habits) && s.months && typeof s.months === "object"; }

function dayRec(k, create){
  const m = monthOf(k);
  if (!S.months[m]) { if (!create) return null; S.months[m] = {u:0, days:{}}; }
  const days = S.months[m].days;
  if (!days[k]) { if (!create) return null; days[k] = {entries:[]}; }
  return days[k];
}
const catById = id => S.config.cats.find(c => c.id === id);
const kindOf = catId => (catById(catId) || {kind:"maint"}).kind;

/* ---------- persistence: device storage + private cloud copy ---------- */
let db = null, base = null, dirty = new Set(), flushTimer = null, syncMode = "device";
function touch(what){ // what: "config" or a month key
  const now = Date.now();
  if (what === "config") S.config.u = now; else if (S.months[what]) S.months[what].u = now;
  dirty.add(what); saveLocal();
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 900);
}
async function flush(){
  if (!db) return;
  const items = [...dirty]; dirty.clear();
  for (const it of items){
    try {
      if (it === "config") await db.doc(base+"/config").set(S.config);
      else if (S.months[it]) await db.doc(base+"/config").collection("months").doc(it).set(S.months[it]);
    } catch(e){
      if (e && e.code === "unavailable") { dirty.add(it); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 3000 + Math.random()*2000); }
      else { syncMode = "device"; db = null; renderTop(); return; }
    }
  }
}
async function initSync(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id(); if (!id) return;
    const b = "data/users/"+id;
    const cfgSnap = await d.doc(b+"/config").get();
    const monSnap = await d.doc(b+"/config").collection("months").get();
    db = d; base = b;
    let changed = false;
    if (cfgSnap.exists){
      const remote = cfgSnap.data();
      if ((remote.u||0) > (S.config.u||0)) { S.config = remote; changed = true; }
      else if ((remote.u||0) < (S.config.u||0)) dirty.add("config");
    } else dirty.add("config");
    const seen = new Set();
    for (const doc of monSnap.docs){
      if (!doc.exists) continue; seen.add(doc.id);
      const r = doc.data(), l = S.months[doc.id];
      if (!l || (r.u||0) > (l.u||0)) { S.months[doc.id] = r; changed = true; }
      else if ((l.u||0) > (r.u||0)) dirty.add(doc.id);
    }
    Object.keys(S.months).forEach(m => { if (!seen.has(m)) dirty.add(m); });
    syncMode = "cloud";
    saveLocal();
    if (dirty.size) flush();
    if (changed) render(); else renderTop();
  } catch(e){ syncMode = "device"; renderTop(); }
}

/* ---------- scoring ---------- */
function activeHabits(k){
  return S.config.habits.filter(h => (h.from||S.config.start) <= k && (!h.until || h.until > k));
}
function dayStats(k){
  const rec = dayRec(k) || {entries:[]};
  let inv=0, waste=0, maint=0; const byCat = {};
  for (const e of rec.entries){
    const kind = kindOf(e.cat);
    if (kind === "invest") inv += e.min; else if (kind === "waste") waste += e.min; else maint += e.min;
    byCat[e.cat] = (byCat[e.cat]||0) + e.min;
  }
  const hs = activeHabits(k);
  const doneIds = new Set(rec.entries.filter(e => e.habit).map(e => e.habit));
  const done = hs.filter(h => doneIds.has(h.id)).length;
  const c = hs.length ? done / hs.length : 0;
  const w = Math.min(1, waste / (Math.max(0.5, S.config.wasteLimit) * 60));
  const rate = 0.01 * Math.max(-1, Math.min(1, c - w));
  return {inv, waste, maint, byCat, done, total:hs.length, c, w, rate, doneIds};
}
function series(){
  const out = []; let idx = 100; const t = todayKey();
  let k = S.config.start > t ? t : S.config.start;
  let n = 0;
  while (k <= t && n < 3000){ const st = dayStats(k); idx *= (1 + st.rate); out.push({k, idx, st}); k = addDays(k,1); n++; }
  return out;
}
function streaks(h){
  const t = todayKey(); let cur = 0, best = 0, run = 0;
  let k = h.from || S.config.start;
  while (k <= t){
    const rec = dayRec(k); const done = rec && rec.entries.some(e => e.habit === h.id);
    if (done){ run++; best = Math.max(best, run); } else if (k !== t) run = 0;
    k = addDays(k,1);
  }
  cur = run; return {cur, best};
}

/* ---------- actions ---------- */
function toggleHabit(k, h){
  const rec = dayRec(k, true);
  const i = rec.entries.findIndex(e => e.habit === h.id);
  if (i >= 0) rec.entries.splice(i,1);
  else rec.entries.push({id:uid(), cat:h.cat, min:h.min, habit:h.id, note:h.name, at:Date.now()});
  touch(monthOf(k)); render();
}
function addEntry(k, cat, min, note, at){
  if (!(min > 0)) return;
  dayRec(k, true).entries.push({id:uid(), cat, min:Math.round(min), note:note||"", at:at||Date.now()});
  touch(monthOf(k));
}
function delEntry(k, id){
  const rec = dayRec(k); if (!rec) return;
  rec.entries = rec.entries.filter(e => e.id !== id); touch(monthOf(k)); render();
}
function startTimer(cat){
  if (S.config.running) stopTimer(true);
  S.config.running = {cat, start:Date.now()}; touch("config"); render();
}
function stopTimer(silent){
  const r = S.config.running; if (!r) return;
  const min = (Date.now() - r.start) / 60000;
  S.config.running = null; touch("config");
  if (min >= 1) { addEntry(keyOf(new Date(r.start)), r.cat, min, "", r.start); if (!silent) toast("Logged "+fmtHM(min)+" of "+(catById(r.cat)||{name:"time"}).name); }
  else if (!silent) toast("Under a minute, not logged");
  if (!silent) render();
}

/* ---------- UI state ---------- */
let tab = "day", viewDay = todayKey(), confirmBox = null, pendingRestore = null, showBackupText = false;
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function tabsSync(){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"));
}

/* ---------- render ---------- */
const app = $("#app");
function renderTop(){
  const el = $("#syncline"); if (!el) return;
  el.innerHTML = syncMode === "cloud"
    ? '<span class="dot on"></span>Saved on this device + your private copy'
    : '<span class="dot"></span>Saved on this device';
}
function header(){
  return `<div class="top"><div><div class="eyebrow">Pocket Time Bank</div><h1>${tab==="day"?"Daily passbook":tab==="progress"?"Your progress":"Settings & backup"}</h1></div><div class="sync" id="syncline"></div></div>`;
}
function render(){
  tabsSync();
  let h = header();
  if (S.config.sample) h += `<div class="banner"><span>You're looking at sample data.</span><button class="btn" data-act="clear-sample">Clear sample & start fresh</button></div>`;
  if (tab === "day") h += renderDay();
  else if (tab === "progress") h += renderProgress();
  else h += renderSettings();
  app.innerHTML = h;
  renderTop();
  tick();
}

function renderDay(){
  const k = viewDay, t = todayKey(), st = dayStats(k);
  const ser = series(); const idx = ser.length ? ser[ser.length-1].idx : 100;
  const bal = st.inv - st.waste;
  const tot = Math.max(1, st.inv + st.waste + st.maint);
  let h = `<div class="datenav"><button class="iconbtn" data-act="prev" aria-label="Previous day">‹</button><div class="datelabel">${esc(fmtDay(k))}<div class="small muted mono">${k}</div></div><button class="iconbtn" data-act="next" aria-label="Next day" ${k>=t?"disabled":""}>›</button></div>`;
  h += `<section class="passbook" aria-label="Balance">
    <div><div class="eyebrow">Day balance</div><div class="big">${bal<0?"−":"+"}${fmtHM(bal)}</div><div class="sub">${fmtHM(st.inv)} invested · ${fmtHM(st.waste)} wasted</div></div>
    <div><div class="eyebrow">Growth index</div><div class="big">${idx.toFixed(1)}</div><div class="sub">${k===t?"Today so far":"This day"}: ${st.rate>=0?"+":"−"}${Math.abs(st.rate*100).toFixed(2)}%</div></div>
    <div class="full" title="Invested, maintenance and wasted time">
      <span style="width:${st.inv/tot*100}%;background:var(--accent-ink)"></span>
      <span style="width:${st.maint/tot*100}%;background:color-mix(in srgb,var(--accent-ink) 45%,transparent)"></span>
      <span style="width:${st.waste/tot*100}%;background:var(--waste-soft)"></span>
    </div>
  </section>`;

  // habits
  const hs = activeHabits(k);
  h += `<section class="card"><div class="row between"><h2>Habits</h2><span class="small muted mono">${st.done}/${st.total} deposited</span></div>`;
  if (!hs.length) h += `<div class="empty">No habits yet. Add one in Settings, and every time you tick it off, its minutes go into your invested balance.</div>`;
  else {
    h += `<div class="habits">`;
    for (const hb of hs){
      const done = st.doneIds.has(hb.id); const sk = streaks(hb);
      h += `<button class="habit ${done?"done":""}" data-act="habit" data-id="${hb.id}" aria-pressed="${done}"><span class="box">${done?"✓":""}</span><span class="name">${esc(hb.name)}</span><span class="meta mono">+${fmtHM(hb.min)}${sk.cur>1?`<br><span class="streak">${sk.cur}-day streak</span>`:""}</span></button>`;
    }
    h += `</div>`;
  }
  h += `</section>`;

  // timer (today only)
  if (k === t){
    const r = S.config.running;
    h += `<section class="card"><h2>Track what you're doing now</h2>`;
    if (r){
      const c = catById(r.cat) || {name:"Unknown", kind:"maint"};
      h += `<div class="running"><div style="flex:1;min-width:0"><span class="tag ${c.kind}">${KINDS[c.kind]}</span><div style="font-weight:600;margin-top:4px">${esc(c.name)}</div><div class="small muted">since ${fmtTime(r.start)}</div></div><div class="clock" id="clock">0:00:00</div></div><button class="btn primary" data-act="stop">Stop & log</button>`;
    }
    h += `<div class="small muted">${r?"Switch to:":"Tap what you're starting. Tap Stop when you switch."}</div><div class="chips">`;
    for (const c of S.config.cats){ if (r && r.cat === c.id) continue; h += `<button class="chip" data-act="start" data-id="${c.id}"><i style="background:var(--${c.kind})"></i>${esc(c.name)}</button>`; }
    h += `</div></section>`;
  }

  // manual add
  h += `<section class="card"><h2>Add time by hand</h2><form class="form" id="addForm">
    <label class="f full">Category<select id="addCat">${S.config.cats.map(c=>`<option value="${c.id}">${esc(c.name)} · ${KINDS[c.kind]}</option>`).join("")}</select></label>
    <label class="f">Hours<input type="number" id="addH" min="0" max="24" step="1" inputmode="numeric" placeholder="0"></label>
    <label class="f">Minutes<input type="number" id="addM" min="0" max="59" step="5" inputmode="numeric" placeholder="30"></label>
    <label class="f full">Note (optional)<input type="text" id="addNote" maxlength="80" placeholder="What was it?"></label>
    <button class="btn primary full" type="submit">Add to ${esc(fmtDay(k).toLowerCase()==="today"?"today":fmtDay(k))}</button>
  </form></section>`;

  // ledger
  const rec = dayRec(k) || {entries:[]};
  const entries = [...rec.entries].sort((a,b) => (b.at||0) - (a.at||0));
  h += `<section class="card"><div class="row between"><h2>Ledger</h2><span class="small muted">${entries.length} ${entries.length===1?"entry":"entries"}</span></div>`;
  if (!entries.length){

  } else {
    h += `<div class="ledger">`;

      h += `<div class="entry"><span class="tag ${c.kind}">${c.kind==="invest"?"In":c.kind==="waste"?"Out":"Hold"}</span><div class="what"><b>${esc(e.habit ? e.note : c.name)}</b><span>${e.habit?"Habit · ":""}${esc(e.habit?c.name:(e.note||""))}${e.at?` · ${fmtTime(e.at)}`:""}</span></div><span class="amt ${sign}">${sign==="plus"?"+":sign==="minus"?"−":""}${fmtHM(e.min)}</span><button class="x" data-act="del" data-id="${e.id}" aria-label="Delete entry">×</button></div>`;
    }
    h += `</div>`;
  }
  h += `</section>`;
  return h;
}

function renderProgress(){
  const ser = series(); const last = ser[ser.length-1];
  const idx = last ? last.idx : 100;
  const days = ser.length;
  const ideal = 100 * Math.pow(1.01, days);
  const week = ser.slice(-7);
  const wInv = week.reduce((a,d)=>a+d.st.inv,0), wWaste = week.reduce((a,d)=>a+d.st.waste,0);
  let h = `<section class="card"><div class="stats">
    <div class="stat"><span class="eyebrow">Index</span><b>${idx.toFixed(1)}</b><span class="small muted">from 100</span></div>
    <div class="stat"><span class="eyebrow">7-day net</span><b style="color:var(--${wInv-wWaste>=0?"invest":"waste"})">${wInv-wWaste>=0?"+":"−"}${fmtHM(wInv-wWaste)}</b><span class="small muted">invested − wasted</span></div>
    <div class="stat"><span class="eyebrow">Days</span><b>${days}</b><span class="small muted">since ${esc(parseKey(S.config.start).toLocaleDateString(undefined,{day:"numeric",month:"short"}))}</span></div>

  // Index chart
  h += `<section class="card"><div><h2>Growth index</h2><div class="small muted">Each day moves the index by up to ±1%: habit completion lifts it, wasted time over your ${S.config.wasteLimit}h limit pulls it down. A perfect run would be at ${ideal.toFixed(1)} by now.</div></div><div class="chart">${indexChart(ser)}</div>
  <div class="legend"><span><i style="background:var(--accent)"></i>You</span><span><i style="background:var(--gold)"></i>Perfect 1% a day</span><span><i style="background:var(--muted)"></i>Start (100)</span></div></section>`;

  // Balance bars
  h += `<section class="card"><div><h2>Last 14 days</h2><div class="small muted">Invested above the line, wasted below.</div></div><div class="chart">${balanceChart(ser.slice(-14))}</div></section>`;

  // Heatmap
  const weeks = 12; const t = todayKey();
  let cells = "";

  const cols = weeks;
  const firstMonday = addDays(t, -((parseKey(t).getDay()+6)%7) - (weeks-1)*7);
  for (let r=0;r<7;r++) for (let c=0;c<cols;c++){

    cells += `<div title="${k}: ${st.done}/${st.total} habits" style="background:${a?`color-mix(in srgb,var(--invest) ${Math.round(25+a*75)}%,var(--sunken))`:"var(--sunken)"}"></div>`;
  }
  h += `<section class="card"><div><h2>Habit heatmap</h2><div class="small muted">Last 12 weeks, Monday at the top. Darker means more habits done.</div></div><div class="heat" style="--cols:${cols}">${cells}</div></section>`;

  else { h += `<table class="statement"><tbody>`; for (const hb of hs){ const s = streaks(hb); h += `<tr><td>${esc(hb.name)}</td><td class="mono"><span class="streak">${s.cur}</span> now · best ${s.best}</td></tr>`; } h += `</tbody></table>`; }
  h += `</section>`;

  const byCat = {}; week.forEach(d => { for (const c in d.st.byCat) byCat[c] = (byCat[c]||0) + d.st.byCat[c]; });

    for (const [cid, m] of rows){ const c = catById(cid) || {name:"Removed", kind:"maint"}; h += `<tr><td><span class="tag ${c.kind}">${c.kind==="invest"?"In":c.kind==="waste"?"Out":"Hold"}</span> ${esc(c.name)}</td><td class="amt ${c.kind==="invest"?"plus":c.kind==="waste"?"minus":"zero"}">${fmtHM(m)}</td></tr>`; }
    h += `</tbody><tfoot><tr><td>Net (invested − wasted)</td><td class="amt">${wInv-wWaste>=0?"+":"−"}${fmtHM(wInv-wWaste)}</td></tr></tfoot></table>`;
  }
  h += `</section>`;
  return h;
}

function indexChart(ser){
  const W=360, H=190, L=38, R=10, T=12, B=26;
  const n = Math.max(2, ser.length);
  const vals = ser.map(d=>d.idx);
  const ideal = ser.map((d,i)=>100*Math.pow(1.01,i+1));
  let lo = Math.min(100, ...vals), hi = Math.max(100, ...vals, ...ideal);
  const span = Math.max(2, hi-lo); lo -= span*0.08; hi += span*0.08;
  const x = i => L + (W-L-R) * (n===1?0:i/(n-1));
  const y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));
  const path = arr => arr.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  let g = "";
  const ticks = niceTicks(lo, hi, 4);
  for (const tv of ticks){ g += `<line x1="${L}" x2="${W-R}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(tv)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${tv.toFixed(tv%1?1:0)}</text>`; }
  g += `<line x1="${L}" x2="${W-R}" y1="${y(100)}" y2="${y(100)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  if (ser.length){
    g += `<path d="${path(ideal)}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    const area = path(vals) + ` L${x(vals.length-1)} ${y(lo)} L${x(0)} ${y(lo)} Z`;
    g += `<path d="${area}" fill="var(--accent)" opacity=".12"/>`;
    g += `<path d="${path(vals)}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
    const li = vals.length-1;
    g += `<circle cx="${x(li)}" cy="${y(vals[li])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    const f = ser[0].k, l = ser[li].k;
    const lab = k => parseKey(k).toLocaleDateString(undefined,{day:"numeric",month:"short"});
    g += `<text x="${L}" y="${H-8}" font-size="10" fill="var(--muted)">${esc(lab(f))}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="10" fill="var(--muted)">${esc(lab(l))}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth index over time">${g}</svg>`;
}
function niceTicks(lo, hi, count){
  const raw = (hi-lo)/count; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const norm = raw/mag;
  const step = (norm<1.5?1:norm<3?2:norm<7?5:10)*mag; const out = [];
  for (let v = Math.ceil(lo/step)*step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function balanceChart(days){
  const W=360, H=180, L=34, R=8, T=10, B=22;
  const maxV = Math.max(60, ...days.map(d=>Math.max(d.st.inv, d.st.waste)));
  const top = Math.ceil(maxV/60)*60;
  const mid = T + (H-T-B)/2; const half = (H-T-B)/2;
  const n = Math.max(1, days.length); const slot = (W-L-R)/n; const bw = Math.max(4, slot*0.6);
  let g = `<line x1="${L}" x2="${W-R}" y1="${mid}" y2="${mid}" stroke="var(--muted)"/>`;
  g += `<text x="${L-6}" y="${T+8}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${top/60}h</text>`;
  g += `<text x="${L-6}" y="${H-B}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${top/60}h</text>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${T}" y2="${T}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  days.forEach((d,i)=>{
    const cx = L + slot*i + (slot-bw)/2;
    const hi = d.st.inv/top*half, hw = d.st.waste/top*half;
    if (hi) g += `<rect x="${cx}" y="${mid-hi}" width="${bw}" height="${hi}" rx="2" fill="var(--invest)"/>`;
    if (hw) g += `<rect x="${cx}" y="${mid}" width="${bw}" height="${hw}" rx="2" fill="var(--waste)"/>`;
    if (i===0 || i===days.length-1 || n<=7){ g += `<text x="${cx+bw/2}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(parseKey(d.k).toLocaleDateString(undefined,{day:"numeric",month:"short"}))}</text>`; }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Invested and wasted hours per day">${g}</svg>`;
}

  // Categories

  h += `</div><form class="form" id="catForm">

  // Scoring
  h += `<section class="card"><h2>How the index is scored</h2>

    <label class="f">Daily waste limit (hours)<input type="number" id="wasteLimit" min="0.5" max="12" step="0.5" value="${S.config.wasteLimit}" inputmode="decimal"></label></section>`;

  else h += `<button class="btn danger" data-act="erase" style="align-self:flex-start">Erase all data…</button>`;
  h += `</section>`;
  return h;
}

/* ---------- backup ---------- */
function backupText(){ return JSON.stringify({app:"pocket-time-bank", version:1, exportedAt:new Date().toISOString(), data:S}, null, 1); }
function parseBackup(txt){
  try { const o = JSON.parse(txt); const d = o && o.app === "pocket-time-bank" ? o.data : o; if (!valid(d)) return null; d._exportedAt = o.exportedAt || null; return d; } catch(e){ return null; }
}
async function saveBackup(){
  const name = "time-bank-backup-"+todayKey()+".json";
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){}
  if (!dl){
    try {
      const blob = new Blob([backupText()], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("Backup saved to Downloads");
    } catch(err){ showBackupText = true; render(); toast("Couldn't save a file here. Copy the backup text instead."); }
    return;
  }
  try { await dl.save({filename:name, data:backupText()}); toast("Backup saved"); }
  catch(e){
    if (e && e.code === "declined") toast("Backup not saved");
    else if (e && e.code === "rate_limited") toast("A save prompt is already open");
    else { showBackupText = true; render(); toast("Couldn't save a file here. Copy the backup text instead."); }
  }
}
function applyRestore(d){
  delete d._exportedAt;
  S = d; S.config.u = Date.now(); Object.values(S.months).forEach(m => m.u = Date.now());
  dirty.add("config"); Object.keys(S.months).forEach(m => dirty.add(m));
  saveLocal(); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 300);
  viewDay = todayKey(); pendingRestore = null; render(); toast("Backup restored");
}

/* ---------- sample data ---------- */
function loadSample(){
  const t = todayKey(); const st = addDays(t, -20);
  S.config.start = st; S.config.sample = true;
  S.config.habits.forEach(h => h.from = st);
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for (let i=0;i<=20;i++){
    const k = addDays(st, i); const rec = dayRec(k, true); rec.entries = [];
    const d0 = parseKey(k).getTime();
    const skill = Math.min(0.92, 0.45 + i*0.022);
    S.config.habits.forEach((h, j) => { if (rnd() < skill) rec.entries.push({id:uid(), cat:h.cat, min:h.min, habit:h.id, note:h.name, at:d0 + (7+j*4)*3600e3}); });
    rec.entries.push({id:uid(), cat:"sleep", min:420+Math.round(rnd()*60), note:"", at:d0+3600e3});
    rec.entries.push({id:uid(), cat:"deep", min:90+Math.round(rnd()*120), note:"Project work", at:d0+10*3600e3});
    rec.entries.push({id:uid(), cat:"social", min:Math.round((150 - i*5)*(0.6+rnd()*0.6)), note:"", at:d0+21*3600e3});
    if (rnd()<0.4) rec.entries.push({id:uid(), cat:"video", min:30+Math.round(rnd()*60), note:"", at:d0+22*3600e3});
    touch(monthOf(k));
  }
  touch("config"); render();
}
function clearSample(){
  const keepHabits = S.config.habits, keepCats = S.config.cats, wl = S.config.wasteLimit;
  const fresh = defaultState();
  Object.keys(S.months).forEach(m => { S.months[m] = {u:Date.now(), days:{}}; dirty.add(m); });
  S.config = fresh.config; S.config.habits = keepHabits.map(h => ({...h, from:fresh.config.start})); S.config.cats = keepCats; S.config.wasteLimit = wl;
  touch("config"); viewDay = todayKey(); render();
}

document.addEventListener("click", e => {
  const tb = e.target.closest(".tab");
  if (tb){ tab = tb.dataset.tab; confirmBox = null; render(); window.scrollTo(0,0); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case "prev": viewDay = addDays(viewDay,-1); render(); break;
    case "next": if (viewDay < todayKey()) { viewDay = addDays(viewDay,1); render(); } break;
    case "habit": { const h = S.config.habits.find(x=>x.id===id); if (h) toggleHabit(viewDay, h); break; }
    case "start": startTimer(id); break;
    case "stop": stopTimer(false); break;
    case "del": delEntry(viewDay, id); break;
    case "sample": loadSample(); break;
    case "clear-sample": clearSample(); break;
    case "backup": saveBackup(); break;
    case "restore": $("#restoreFile").value = ""; $("#restoreFile").click(); break;
    case "restore-yes": if (pendingRestore) applyRestore(pendingRestore); break;
    case "restore-no": pendingRestore = null; render(); break;
    case "toggle-text": showBackupText = !showBackupText; render(); break;
    case "copy": {
      const ta = $("#bkOut");
      try { navigator.clipboard.writeText(ta.value).then(()=>toast("Backup text copied"), ()=>{ ta.select(); toast("Text selected. Copy it from here."); }); }
      catch(err){ ta.select(); toast("Text selected. Copy it from here."); }
      break;
    }
    case "paste-restore": { const d = parseBackup($("#bkIn").value); if (!d) toast("That doesn't look like a Time Bank backup"); else { pendingRestore = d; render(); } break; }
    case "del-habit": { const h = S.config.habits.find(x=>x.id===id); if (h){ const t = todayKey(); if ((h.from||S.config.start) >= t) S.config.habits = S.config.habits.filter(x=>x.id!==id); else h.until = t; touch("config"); render(); } break; }
    case "del-cat": {
      if (S.config.cats.length <= 1) { toast("Keep at least one category"); break; }
      if (S.config.habits.some(h => !h.until && h.cat === id)) { toast("A habit uses this category. Remove the habit first."); break; }
      S.config.cats = S.config.cats.filter(c=>c.id!==id); touch("config"); render(); break;
    }
    case "erase": confirmBox = "erase"; render(); break;
    case "erase-no": confirmBox = null; render(); break;
    case "erase-yes": {
      const fresh = defaultState(); Object.keys(S.months).forEach(m => { fresh.months[m] = {u:Date.now(), days:{}}; dirty.add(m); });
      S = fresh; confirmBox = null; touch("config"); viewDay = todayKey(); render(); toast("All data erased"); break;
    }
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "addForm"){
    const min = (parseFloat($("#addH").value)||0)*60 + (parseFloat($("#addM").value)||0);
    if (!(min > 0)) { toast("Enter hours or minutes"); return; }
    const k = viewDay; const at = k === todayKey() ? Date.now() : parseKey(k).getTime() + 12*3600e3;
    addEntry(k, $("#addCat").value, min, $("#addNote").value.trim(), at);
    toast("Added "+fmtHM(min)); render();
  } else if (f.id === "habitForm"){
    const name = $("#hName").value.trim(); const min = parseInt($("#hMin").value,10); const cat = $("#hCat").value;
    if (!name || !(min>0) || !cat) { toast("Give the habit a name, minutes and category"); return; }
    S.config.habits.push({id:"h-"+uid(), name, min, cat, from:todayKey()}); touch("config"); render(); toast("Habit added");
  } else if (f.id === "catForm"){
    const name = $("#cName").value.trim(); if (!name) return;
    S.config.cats.push({id:"c-"+uid(), name, kind:$("#cKind").value}); touch("config"); render(); toast("Category added");
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "wasteLimit"){ const v = parseFloat(e.target.value); if (v >= 0.5 && v <= 12){ S.config.wasteLimit = v; touch("config"); } }
  if (e.target.id === "restoreFile"){
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { const d = parseBackup(String(r.result)); if (!d) toast("That file isn't a Time Bank backup"); else { pendingRestore = d; tab = "settings"; render(); } };
    r.onerror = () => toast("Couldn't read that file");
    r.readAsText(file);
  }
});

/* ---------- live clock ---------- */
function tick(){ const c = $("#clock"); if (c && S.config.running) c.textContent = fmtClock(Date.now() - S.config.running.start); }
setInterval(tick, 1000);

render();
initSync();
})();
</script>
